# ProGuard config for Server Maintainer
-injars build/classes
-outjars build/optimized
-libraryjars <java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)

# Keep entry point
-keep class dev.woflo.fabric.Main {
    public static void main(java.lang.String[]);
}

# Optimization settings
-optimizationpasses 5
-overloadaggressively
-repackageclasses ''
-allowaccessmodification
-mergeinterfacesaggressively

# Remove attributes we don't need
-dontwarn

# Keep Loader enum for switch/reflection
-keepclassmembers enum dev.woflo.fabric.Loader {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
